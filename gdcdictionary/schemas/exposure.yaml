$schema: "http://json-schema.org/draft-04/schema#"

id: "exposure"
title: Exposure
type: object
namespace: https://vpodc.org/
category: clinical
program: '*'
project: '*'
description: >
  Clinically relevant patient information not immediately resulting from genetic predispositions.
additionalProperties: false
submittable: true
downloadable: false
validators: null

systemProperties:
  - id
  - project_id
  - state
  - created_datetime
  - updated_datetime

links:
  - name: cases
    backref: exposures
    label: describes
    target_type: case
    multiplicity: many_to_one
    required: true

required:
  - submitter_id
  - type
  - cases

uniqueKeys:
  #unclear if want submitter ID for clinical
  - [id]
  - [project_id, submitter_id]

properties:
  $ref: "_definitions.yaml#/ubiquitous_properties"

  DRINK_CURRENT:
    description: >

    enum:
      - 'Yes'
      - 'No'
      - 'Not reported / Unknown'

  DRINK_MIN_12:
    description: >

    enum:
      - 'Yes'
      - 'No'
      - 'Not reported / Unknown'

  DRINK_BEER_FREQ:
    description: >

    enum:
      - '1 D'
      - '2 - 3 D'
      - '> 4 D'
      - '4 - 6 W'
      - '1 - 3 W'
      - '1 - 3 M'
      - 'Not reported / Unknown'

  DRINK_WINE_FREQ:
    description: >

    enum:
      - '1 D'
      - '2 - 3 D'
      - '> 4 D'
      - '4 - 6 W'
      - '1 - 3 W'
      - '1 - 3 M'
      - 'Not reported / Unknown'

  DRINK_LIQUOR_FREQ:
    description: >

    enum:
      - '1 D'
      - '2 - 3 D'
      - '> 4 D'
      - '4 - 6 W'
      - '1 - 3 W'
      - '1 - 3 M'
      - 'Not reported / Unknown'

  DRINK_START_AGE:
