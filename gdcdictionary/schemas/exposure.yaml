$schema: "http://json-schema.org/draft-04/schema#"

id: "exposure"
title: Exposure
type: object
namespace: https://vpodc.org/
category: clinical
program: '*'
project: '*'
description: >
  Clinically relevant patient information not immediately resulting from genetic predispositions.
additionalProperties: false
submittable: true
downloadable: false
validators: null

systemProperties:
  - id
  - project_id
  - state
  - created_datetime
  - updated_datetime

links:
  - name: cases
    backref: exposures
    label: describes
    target_type: case
    multiplicity: many_to_one
    required: true

required:
  - submitter_id
  - type
  - cases

uniqueKeys:
  #unclear if want submitter ID for clinical
  - [id]
  - [project_id, submitter_id]

properties:
  $ref: "_definitions.yaml#/ubiquitous_properties"

  DRINK_CURRENT:
    description: >
      Does participant currently drink alcohol
    enum:
      - 'Yes'
      - 'No'
      - 'Not reported / Unknown'

  DRINK_MIN_12:
    description: >
      Has participant ever had at least 12 drinks of any kind of alcoholic bevarage in their entire life
    enum:
      - 'Yes'
      - 'No'
      - 'Not reported / Unknown'

  DRINK_BEER_FREQ:
    description: >
      How often participant consumed beer (12 oz. can) in the twelve months prior to current diagnosis
    enum:
      - '1 D'
      - '2 - 3 D'
      - '> 4 D'
      - '4 - 6 W'
      - '1 - 3 W'
      - '1 - 3 M'
      - 'Not reported / Unknown'

  DRINK_WINE_FREQ:
    description: >
      How often participant consumed wine or wine coolers (5oz. glass) in the twelve months prior to current diagnosis
    enum:
      - '1 D'
      - '2 - 3 D'
      - '> 4 D'
      - '4 - 6 W'
      - '1 - 3 W'
      - '1 - 3 M'
      - 'Not reported / Unknown'

  DRINK_LIQUOR_FREQ:
    description: >
      How often participant consumed liquor or mixed drinks (1 shot) in the twelve months prior to current diagnosis
    enum:
      - '1 D'
      - '2 - 3 D'
      - '> 4 D'
      - '4 - 6 W'
      - '1 - 3 W'
      - '1 - 3 M'
      - 'Not reported / Unknown'

  DRINK_START_AGE:
    description: >
      Age at which participant started drinking alcohol
    type: number

  DRINK_STOP_AGE:
    description: >
      Age at which participant stopped drinking alcohol
    type: number

  DRINK_TOTAL_YEARS:
    description: >
      Approximately how many years participant consumed alcohol (not including times when having quit)
    type: number

  SMOKE_MIN_100:
    description: >
      Has participant ever smoked at least 100 cigarettes (which is equal to 5 packs) in their entire life
    enum:
      - 'Yes'
      - 'No'
      - 'Not reported / Unknown'

  SMOKE_CURRENT:
    description: >
      Does participant currently smoke cigarettes
    enum:
      - 'Yes'
      - 'No'
      - 'Not reported / Unknown'

  SMOKE_DAILY_AMT:
    description: >
      Approxiamte number of packs per day participant smokes or smoked (when smoking)
    enum:
      - '< 0.5'
      - '0.5 - 1.0'
      - '1.0 - 2.0'
      - '> 2.0'
      - 'Not reported / Unknown'

  SMOKE_CIGAR_PIPE:
    description: >
      Has participant ever smoked at least 1 cigar a month for more than 6 months or smoked a pipe on a daily basis for more than 6 months
    enum:
      - 'Yes'
      - 'No'
      - 'Not reported / Unknown'

  SMOKE_SMOKELESS:
    description: >
      Has participant ever used smokeless tobacco (chew, dip, snuff) on a daily basis for more than 6 months
    enum:
      - 'Yes'
      - 'No'
      - 'Not reported / Unknown'

  SMOKE_START_AGE:
    description: >
      Age at which participant started smoking cigarettes
    type: number

  SMOKE_STOP_AGE:
    description: >
      Age at which participant stopped smoking cigarettes
    type: number

  SMOKE_TOTAL_YEARS:
    description: >
      Approximately how many years participant smoked cigarettes (not including times when having quit)
    type: number

  XP_AGENTORANGE:
    description: >
      Exposure to Agent Orange (AO)
    enum:
      - '1-12 months'
      - '13-24 months'
      - '25 months or more'
      - 'Not Reported'
      - 'Unknown'

  XP_ANTHRAX:
    description: >
      Exposure to Anthrax
    enum:
      - '1-12 months'
      - '13-24 months'
      - '25 months or more'
      - 'Not Reported'
      - 'Unknown'

  XP_ASBESTOS:
    description: >
      Exposure to Asbestos
    enum:
      - '1-12 months'
      - '13-24 months'
      - '25 months or more'
      - 'Not Reported'
      - 'Unknown'

  XP_BURNPIT:
    description: >
      Exposure to Burn Pits
    enum:
      - '1-12 months'
      - '13-24 months'
      - '25 months or more'
      - 'Not Reported'
      - 'Unknown'

  XP_CHROMIUM:
    description: >
      Exposure to Hexavalent Chromium
    enum:
      - '1-12 months'
      - '13-24 months'
      - '25 months or more'
      - 'Not Reported'
      - 'Unknown'

  XP_CONSTRUCT:
    description: >
      Exposure to Construction and Demolition
    enum:
      - '1-12 months'
      - '13-24 months'
      - '25 months or more'
      - 'Not Reported'
      - 'Unknown'

  XP_MICROWAVE:
    description: >
      Exposure to Microwaves (excluding small microwave ovens)
    enum:
      - '1-12 months'
      - '13-24 months'
      - '25 months or more'
      - 'Not Reported'
      - 'Unknown'

  XP_MUSTARD:
    description: >
      Exposure to Mustard Gas or Lewisite (MG)
    enum:
      - '1-12 months'
      - '13-24 months'
      - '25 months or more'
      - 'Not Reported'
      - 'Unknown'

  XP_NUCLEAR:
    description: >
      Exposure to communities near nuclear test sites, nuclear power and weapons plants, and uranium mines and mills
    enum:
      - '1-12 months'
      - '13-24 months'
      - '25 months or more'
      - 'Not Reported'
      - 'Unknown'

  XP_PAINT:
    description: >
      Routine skin contact with paint and/or solvent and/or substances
    enum:
      - '1-12 months'
      - '13-24 months'
      - '25 months or more'
      - 'Not Reported'
      - 'Unknown'

  XP_PERCHLORATE:
    description: >
      Exposure to Perchlorate (rocket fuel component/missile testing by-product)
    enum:
      - '1-12 months'
      - '13-24 months'
      - '25 months or more'
      - 'Not Reported'
      - 'Unknown'

  XP_PESTICIDE:
    description: >
      Exposure to Pesticides or herbicides
    enum:
      - '1-12 months'
      - '13-24 months'
      - '25 months or more'
      - 'Not Reported'
      - 'Unknown'

  XP_PETROLEUM:
    description: >
      Exposure to crude petroleum or refining
    enum:
      - '1-12 months'
      - '13-24 months'
      - '25 months or more'
      - 'Not Reported'
      - 'Unknown'

  XP_RADIATION:
    description: >
      Exposure to Radiation
    enum:
      - '1-12 months'
      - '13-24 months'
      - '25 months or more'
      - 'Not Reported'
      - 'Unknown'

  XP_RESP:
    description: >
      Exposure to occupational hazards requiring protective equipment such as respirators
    enum:
      - '1-12 months'
      - '13-24 months'
      - '25 months or more'
      - 'Not Reported'
      - 'Unknown'

  XP_URANIUM:
    description: >
      Exposure to Depleted Uranium (DU)
    enum:
      - '1-12 months'
      - '13-24 months'
      - '25 months or more'
      - 'Not Reported'
      - 'Unknown'

  XP_WARFARE:
    description: >
      Exposure to chemical or biological warfare agents
    enum:
      - '1-12 months'
      - '13-24 months'
      - '25 months or more'
      - 'Not Reported'
      - 'Unknown'

  XP_WOUNDS:
    description: >
      Disability, injury, or sickness incurred as a result of wounds caused by military weapons, accidents involving a military combat vehicle or by fumes, gases, or explosion of military ordnance, vehicles, or material
    enum:
      - '1-12 months'
      - '13-24 months'
      - '25 months or more'
      - 'Not Reported'
      - 'Unknown'

  XP_XRAY:
    description: >
      Exposure to X-ray (fluoroscopic equipment or radioactive materials)
    enum:
      - '1-12 months'
      - '13-24 months'
      - '25 months or more'
      - 'Not Reported'
      - 'Unknown'

  XP_OTHER:
    description: >
      Other exposure (not specified)
    enum:
      - '1-12 months'
      - '13-24 months'
      - '25 months or more'
      - 'Not Reported'
      - 'Unknown'

  MILITARY_ASSOCIATION:
    description: >
      Military Association
    type: array
    items:
      type: string

  cases:
    $ref: "_definitions.yaml#/to_one"
